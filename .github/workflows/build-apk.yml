name: Build TITAN AI APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract TITAN project ZIP
        shell: bash
        run: | set -e ZIP="$(find . -maxdepth 1 -type f -name 'TITAN_AI_V44_GITHUB_ONE_CLICK*.zip' | head -n 1)" if [ -z "$ZIP" ]; then echo "TITAN project ZIP not found." exit 1 fi mkdir -p project unzip -q "$ZIP" -d project echo "Project extracted:" find project -maxdepth 2 -type f | head -50 
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-AI-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
