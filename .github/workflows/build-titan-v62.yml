name: Build TITAN V62.1 JJJ Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'TITAN_V62_JJJ_ANDROID_GITHUB_BUILD.zip'
      - '.github/workflows/build-titan-v62.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android project archive
        run: |
          test -f TITAN_V62_JJJ_ANDROID_GITHUB_BUILD.zip || {
            echo "::error::Missing TITAN_V62_JJJ_ANDROID_GITHUB_BUILD.zip in repository root."
            echo "Upload the ZIP downloaded from this ChatGPT conversation to the root of the Aes repository, then push it."
            exit 1
          }

      - name: Extract project
        run: |
          mkdir -p _titan_build
          unzip -q TITAN_V62_JJJ_ANDROID_GITHUB_BUILD.zip -d _titan_build
          PROJECT_DIR="$(find _titan_build -name settings.gradle -type f -print -quit | xargs dirname)"
          test -n "$PROJECT_DIR" || { echo "::error::settings.gradle not found in ZIP"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        working-directory: ${{ env.PROJECT_DIR }}
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-V62-JJJ-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
